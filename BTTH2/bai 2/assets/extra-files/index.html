<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Travel Landing Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- HEADER -->
    <header>
        <div class="logo">TRAVEL GOALS</div>
        <nav>
            <a href="#">Destinations</a>
            <a href="#">Packages</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <main>

        <!-- HERO -->
        <section class="hero">
            <div class="hero-content">
                <h1>JOE'S TRAVEL PAGE</h1>
                <p>LET'S EXPLORE THE WORLD TOGETHER</p>
                <button>Discover places</button>
            </div>
        </section>

        <!-- HIGHLIGHTS -->
        <section class="highlights">
            <h2>HIGHLIGHTS</h2>

            <div class="cards">
                <div class="card">
                    <img src="cities/miami.jpg" alt="">
                    <p class="country">MIAMI <span>USA</span></p>
                </div>

                <div class="card">
                    <img src="cities/munich.jpg" alt="">
                    <p class="country">MUNICH <span>GERMANY</span></p>
                </div>

                <div class="card">
                    <img src="cities/barcelona.jpg" alt="">
                    <p class="country">BARCELONA <span>SPAIN</span></p>
                </div>
            </div>
        </section>

    </main>

    <!-- FOOTER -->
    <footer>
        <div class="social">
            <a href="#"><img src="icons/instagram.png" alt=""></a>
            <a href="#"><img src="icons/facebook.png" alt=""></a>
        </div>
    </footer>

</body>
</html>
