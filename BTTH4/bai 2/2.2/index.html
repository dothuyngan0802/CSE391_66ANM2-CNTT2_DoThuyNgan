<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Đặt hàng</title>

<style>

body{
font-family: Arial, sans-serif;
background:#f2f4f7;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
margin:0;
}

.container{
background:white;
padding:30px;
border-radius:10px;
width:420px;
box-shadow:0 8px 25px rgba(0,0,0,0.1);
}

h2{
text-align:center;
margin-bottom:20px;
}

label{
font-weight:bold;
display:block;
margin-top:10px;
}

input,select,textarea{
width:100%;
padding:10px;
margin-top:5px;
border:1px solid #ccc;
border-radius:6px;
font-size:14px;
box-sizing:border-box;
}

input:focus,select:focus,textarea:focus{
border-color:#4a90e2;
outline:none;
}

textarea{
resize:none;
height:70px;
}

.radio-group{
display:flex;
gap:20px;
margin-top:8px;
}

.radio-group label{
font-weight:normal;
}

.error{
color:red;
font-size:13px;
margin-top:3px;
}

.counter{
font-size:12px;
text-align:right;
color:#555;
}

.total{
background:#f8f9fb;
padding:10px;
border-radius:6px;
margin-top:10px;
font-size:16px;
}

button{
width:100%;
padding:12px;
margin-top:15px;
border:none;
border-radius:6px;
background:linear-gradient(45deg,#4a90e2,#357abd);
color:white;
font-size:16px;
cursor:pointer;
transition:0.3s;
}

button:hover{
transform:translateY(-2px);
box-shadow:0 5px 15px rgba(0,0,0,0.15);
}

#confirmBox{
margin-top:15px;
padding:15px;
border-radius:8px;
background:#f6f8fc;
display:none;
}

#confirmBox button{
width:48%;
margin-top:10px;
}

.confirm-actions{
display:flex;
justify-content:space-between;
}

.success{
text-align:center;
color:green;
font-size:20px;
margin-top:20px;
}

</style>
</head>

<body>

<div class="container">

<h2>🛒 Đặt hàng</h2>

<form id="orderForm">

<label>Tên sản phẩm</label>
<select id="product">
<option value="">-- Chọn sản phẩm --</option>
<option value="Áo">Áo</option>
<option value="Quần">Quần</option>
<option value="Giày">Giày</option>
</select>
<div class="error" id="productError"></div>

<label>Số lượng</label>
<input type="number" id="quantity">
<div class="error" id="quantityError"></div>

<label>Ngày giao hàng</label>
<input type="date" id="delivery">
<div class="error" id="deliveryError"></div>

<label>Địa chỉ giao</label>
<input type="text" id="address">
<div class="error" id="addressError"></div>

<label>Ghi chú</label>
<textarea id="note"></textarea>
<div class="counter" id="noteCounter">0/200</div>
<div class="error" id="noteError"></div>

<label>Thanh toán</label>

<div class="radio-group">
<label><input type="radio" name="pay" value="COD"> COD</label>
<label><input type="radio" name="pay" value="Bank"> Chuyển khoản</label>
<label><input type="radio" name="pay" value="Wallet"> Ví điện tử</label>
</div>

<div class="error" id="payError"></div>

<div class="total">
Tổng tiền: <b id="total">0</b> VND
</div>

<button type="submit">Đặt hàng</button>

</form>

<div id="confirmBox"></div>

<div id="success"></div>

</div>

<script src="script.js"></script>

</body>
</html>
